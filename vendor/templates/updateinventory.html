{% extends "base.html" %}

{% block title %}
Update Inventory
{% endblock %}

{% block content %}

<div class="inventory-update-page">

    <h1>Update Inventory</h1>

    <p>Update stock for {{ product.name }}</p>

    <div class="inventory-update-card">

        <h2>{{ product.name }}</h2>

        <p>
            Current Stock:
            <strong>
                {{ product.stock_quantity }}
                {{ product.unit }}
            </strong>
        </p>

        <form method="POST">

            {% csrf_token %}

            <label for="quantity">
                New Stock Quantity
            </label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                value="{{ product.stock_quantity }}"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">
                Update Stock
            </button>

        </form>

    </div>

</div>

{% endblock %}
