{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <title>
        {% block title %}
        Vendor Management
        {% endblock %}
    </title>
</head>

<body>

<div class="navbars">

    <nav class="supplier-nav">

        <div class="profile-icon">

            <i class="bi bi-person"></i>

            <span>Vendor</span>

        </div>

        <div class="items">

            <a href="{% url 'vendordashboard' %}"
               class="navitems">
                <i class="bi bi-house-door"></i>
                <span>Dashboard</span>
            </a>

            <a href="{% url 'productview' %}"
               class="navitems">
                <i class="bi bi-search"></i>
                <span>Products</span>
            </a>

            <a href="{% url 'vendorquotations' %}"
               class="navitems">
                <i class="bi bi-file-earmark-text"></i>
                <span>Quotations</span>
            </a>

            <a href="{% url 'vendorpurchaseorders' %}"
               class="navitems">
                <i class="bi bi-cart-check"></i>
                <span>Purchase Orders</span>
            </a>

            <a href="{% url 'vendoranalytics' %}"
               class="navitems">
                <i class="bi bi-bar-chart"></i>
                <span>Analytics</span>
            </a>

            <a href="{% url 'vendorprofile' %}"
               class="navitems">
                <i class="bi bi-person"></i>
                <span>Profile</span>
            </a>

            <a href="{% url 'logout' %}"
               class="navitems">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>

        </div>

    </nav>

    <main class="dashboard">

        {% block content %}
        {% endblock %}

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
